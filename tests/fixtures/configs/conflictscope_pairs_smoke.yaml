# Test fixture: a conflictscope_pairs intervention over a 2-tenet scenario
# pool, with the same pool as the eval scenarios. Shapes only.
name: conflictscope_pairs_smoke
intervention:
  method: conflictscope_pairs
  value_set: constitution_tenets_v3
  values: [calibrated_uncertainty, hard_constraint_fidelity]
  pool:
    scenario_gen:
      model: gpt-4.1
      filter_model: gpt-4.1
      num_scenarios: 30
      env: eval_api
      gpus: 0
    split:
      test_size: 20
      seed: 42
  completions:
    models: [gpt-4o-mini, gpt-4.1]
    user_model: gpt-4.1
    judge_model: gpt-4.1
    filter: false
    env: eval_api
    gpus: 0
    time: "08:00:00"
  models:
    olmo7b_sft: allenai/OLMo-2-1124-7B-SFT
  wandb_project: valuegen
  train:
    learning_rate: 5.0e-5
    num_train_epochs: 2
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 8
    gradient_checkpointing: true
    eval_strategy: "no"
    remove_unused_columns: false
    use_peft: true
    lora_r: 32
    lora_alpha: 64
    lora_target_modules: [q_proj, v_proj, k_proj, o_proj, gate_proj, up_proj, down_proj]
    report_to: none
    seed: 42
    beta: 0.1
  resources:
    train: {time: "03:00:00", mem: 48G, gpus: 1}
evaluation:
  method: conflictscope
  scenarios:
    pool:
      value_set: constitution_tenets_v3
      scenario_gen:
        model: gpt-4.1
        filter_model: gpt-4.1
        num_scenarios: 30
        env: eval_api
        gpus: 0
      split:
        test_size: 20
        seed: 42
  mode: interactive
  cache: true
  filter: false
  max_scenarios: 50
  judge: {model: Qwen/Qwen3.6-27B, serve: local, gpus: 2, mem: 96G, env: eval_api}
  resources: {time: "03:00:00", mem: 32G, gpus: 1}
  matrices:
    variants: [likert_normalized]
    cols: all
